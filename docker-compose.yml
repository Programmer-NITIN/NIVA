services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: niva-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://niva:niva_dev_2026@postgres:5432/niva
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: niva-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
  postgres:
    image: postgres:16-alpine
    container_name: niva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-niva}
      POSTGRES_USER: ${POSTGRES_USER:-niva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niva_dev_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niva"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: niva-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
